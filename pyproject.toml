[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ipfd"
version = "1.0.1"
description = "Isaac Policy Failure Debugger: expose the moment a policy is doomed before it visibly fails."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yusuf Guenena" }]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
# Isaac Lab is NOT declared here: it is a heavy, GPU-bound, externally-installed
# dependency used only by ipfd.adapters.isaac_lab. The analysis layer never needs it.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402"]
