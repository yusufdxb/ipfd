[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ipfd"
version = "2.0.0.dev0"
description = "Audit counterfactual fidelity of simulator snapshot-and-restore workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuf Guenena" }]
keywords = ["robotics", "simulation", "snapshot", "counterfactual", "reliability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.6",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/yusufdxb/ipfd"
Documentation = "https://github.com/yusufdxb/ipfd#readme"
Issues = "https://github.com/yusufdxb/ipfd/issues"
Repository = "https://github.com/yusufdxb/ipfd"

[project.optional-dependencies]
dev = [
    "mujoco>=3.5",
    "mypy>=1.11",
    "pytest>=7.4",
    "pytest-cov>=5",
    "ruff>=0.4",
]
mujoco = [
    "mujoco>=3.5",
]
# Isaac Lab is NOT declared here: it is a heavy, GPU-bound, externally-installed
# dependency used only by ipfd.adapters.isaac_lab. The analysis layer never needs it.

[project.scripts]
ipfd = "ipfd.cli:main"
ipfd-evidence-gate = "ipfd.evidence_gate_cli:main"
ipfd-demo = "ipfd.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src/ipfd"]
exclude = ["src/ipfd/oracles/pick_lift_sm.py"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["ipfd"]
omit = [
    "src/ipfd/adapters/isaac_lab.py",
    "src/ipfd/adapters/isaac_replay.py",
    "src/ipfd/adapters/mujoco_replay.py",
    "src/ipfd/oracles/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
