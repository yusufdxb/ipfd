name: release

# Minimal tag-triggered release build. Push an annotated tag like `vX.Y.Z` (which
# MUST equal the pyproject / ipfd.__version__ version) and this builds the sdist +
# wheel, validates them, stores them as a workflow artifact, and (once you have
# opted in) publishes to PyPI via trusted publishing (OIDC; no API token stored).
#
# To enable PyPI publishing:
#   1. On PyPI, add this repo as a Trusted Publisher for the project `ipfd`
#      (Publishing -> Add a pending publisher: workflow `release.yml`,
#       environment `pypi`).
#   2. Set the repository variable  PYPI_PUBLISH = true  (Settings -> Variables).
# Until then the build/validate steps run and the publish step is skipped, so
# tagging never fails on an unconfigured repo.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build and validate
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Tag matches package version
        run: |
          TAG=${GITHUB_REF_NAME#v}
          VER=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG pyproject=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != pyproject version $VER"; exit 1; }
      - name: Exercise the built wheel outside the source tree
        run: |
          python -m venv /tmp/ipfd-release
          /tmp/ipfd-release/bin/pip install dist/*.whl
          cd /tmp
          /tmp/ipfd-release/bin/ipfd-demo --json /tmp/ipfd-demo.json
          /tmp/ipfd-release/bin/ipfd --help
          /tmp/ipfd-release/bin/ipfd-evidence-gate --help
          /tmp/ipfd-release/bin/pip check
          test -s /tmp/ipfd-demo.json
      - name: Enforce tagged-commit GPU evidence
        run: |
          EVIDENCE_COMMIT=$(/tmp/ipfd-release/bin/python - <<'PY'
          import json
          with open("release-evidence/competence.json", encoding="utf-8") as handle:
              print(json.load(handle)["software"]["git_commit"])
          PY
          )
          git merge-base --is-ancestor "$EVIDENCE_COMMIT" "$GITHUB_SHA"
          git diff --quiet "$EVIDENCE_COMMIT" "$GITHUB_SHA" -- src scripts pyproject.toml
          /tmp/ipfd-release/bin/ipfd-evidence-gate \
            --competence release-evidence/competence.json \
            --multiseed release-evidence/multiseed.json \
            --actionability release-evidence/actionability.json \
            --expected-git-commit "$EVIDENCE_COMMIT" \
            --report /tmp/ipfd-release-evidence.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write  # OIDC for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
