schema_version: 1
adapter:
  kind: isaac_lab
  simulator: Isaac Lab
  task: Isaac-Lift-Cube-Franka-v0
  device: cuda:0
  headless: true
  num_envs: 2
  initial_seed: 0
  asset_root: https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/4.5
simulator_version: "4.5.22"
environment: Isaac-Lift-Cube-Franka-v0
task: zero_action_scene_restore_smoke
snapshot_protocol: scene_only
branch_states:
  - {id: isaac-live-seed-101-step-0, step: 0, seed: 101, cluster: seed-101}
  - {id: isaac-live-seed-211-step-0, step: 0, seed: 211, cluster: seed-211}
  - {id: isaac-live-seed-307-step-0, step: 0, seed: 307, cluster: seed-307}
horizons: [1, 5, 10, 30, 90]
continuation_mode: exact_action
action_source: zero
decision_functions:
  - task_failure
  - collision
  - sustained_grasp
tolerances:
  default: {absolute: 1.0e-5, relative: 1.0e-5}
  scene_state: {absolute: 1.0e-5, relative: 1.0e-5}
  policy_observations: {absolute: 1.0e-6, relative: 1.0e-5}
  privileged_observations: {absolute: 1.0e-6, relative: 1.0e-5}
  task_state: {absolute: 1.0e-5, relative: 1.0e-5}
  controller_targets: {absolute: 1.0e-6, relative: 1.0e-5}
  sensor_state: {absolute: 1.0e-3, relative: 1.0e-4}
  counters: {absolute: 0.0, relative: 0.0}
  contact_state: {absolute: 1.0e-3, relative: 1.0e-4}
  task_outputs: {absolute: 0.0, relative: 0.0}
  termination: {absolute: 0.0, relative: 0.0}
  reward: {absolute: 1.0e-5, relative: 1.0e-5}
independent_cluster_key: seed
minimum_independent_clusters: 3
output_directory: ../results/v2/isaac_lab_live_scene_only
reduction:
  enabled: true
  max_trials: 80
  branch_steps: []
