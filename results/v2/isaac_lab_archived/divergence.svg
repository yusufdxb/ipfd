<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360"
  viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Replay divergence growth</title>
  <desc id="desc">Maximum raw state error across audited branches by continuation step.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <line x1="72" y1="32" x2="72" y2="304" stroke="#334155"/>
  <line x1="72" y1="304" x2="776" y2="304" stroke="#334155"/>
  <polyline points="" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="400.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="16">Replay divergence growth</text>
  <text x="400.0" y="348" text-anchor="middle" font-family="sans-serif" font-size="13">Continuation step</text>
  <text x="16" y="180.0" transform="rotate(-90 16 180.0)"
    text-anchor="middle" font-family="sans-serif" font-size="13">Maximum raw state error</text>
  <text x="80" y="50" font-family="sans-serif" font-size="12" fill="#475569">No per-step curve retained</text>
</svg>
